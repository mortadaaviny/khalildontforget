<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F5257">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="خليل لا تنسى">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">

<title>خليل لا تنسى</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap">
<style>
/* Layout: two views in one page. Hero = text beside an arch-framed portrait wrapped in a gold thread tied in a knot.
   App = a single reading column: composer on top, open ideas, then finished ideas. */
:root {
  --bg: #E8EEEB;
  --surface: #F6F9F7;
  --fg: #10262B;
  --muted: #4B6564;
  --line: #C6D4CF;
  --brand: #0F5257;
  --on-brand: #FFFFFF;
  --accent: #E0A31A;
  --accent-ink: #8A5800;
  --on-accent: #1E1503;
  --danger: #B42318;
  --glow: rgba(224, 163, 26, 0.16);
  --font: 'IBM Plex Sans Arabic', 'IBM Plex Sans', 'Noto Naskh Arabic', Tahoma, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1B1F; --surface: #12292E; --fg: #E8F0ED; --muted: #98B0AC; --line: #26444A;
    --brand: #2FA79D; --on-brand: #04201E; --accent: #F2B72E; --accent-ink: #F2B72E; --on-accent: #1E1503;
    --danger: #FF8A7A; --glow: rgba(242, 183, 46, 0.12);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B1B1F; --surface: #12292E; --fg: #E8F0ED; --muted: #98B0AC; --line: #26444A;
  --brand: #2FA79D; --on-brand: #04201E; --accent: #F2B72E; --accent-ink: #F2B72E; --on-accent: #1E1503;
  --danger: #FF8A7A; --glow: rgba(242, 183, 46, 0.12);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: 17px;
  line-height: 1.7;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  -webkit-font-smoothing: antialiased;
}
.shell { max-width: 1080px; margin-inline: auto; min-height: 100%; }
button, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 8px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.tnum { font-variant-numeric: tabular-nums; }
.view { animation: viewin .4s ease both; }
@keyframes viewin { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 48px; padding: 10px 24px; border-radius: 14px; border: 1.5px solid transparent;
  font-weight: 600; font-size: 1rem; text-decoration: none; transition: transform .15s ease, background .15s ease, opacity .15s ease;
}
.btn svg { flex: none; }
.btn.primary { background: var(--brand); color: var(--on-brand); }
.btn.primary:hover { transform: translateY(-2px); }
.btn.primary:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.btn.ghost { background: transparent; border-color: var(--line); color: var(--fg); }
.btn.ghost:hover { border-color: var(--brand); color: var(--brand); }
.btn.big { min-height: 56px; padding-inline: 32px; font-size: 1.125rem; }

/* ---------- Hero ---------- */
.hero {
  display: grid; grid-template-columns: 1.1fr .9fr; align-items: center;
  gap: clamp(28px, 6vw, 80px); padding-block: clamp(28px, 6vw, 80px);
  position: relative;
}
.hero::before {
  content: ""; position: absolute; inset-inline-end: -10%; top: 4%; width: 60%; aspect-ratio: 1; z-index: 0;
  background: radial-gradient(closest-side, var(--glow), transparent); pointer-events: none;
}
.hero > * { position: relative; z-index: 1; }
.eyebrow { display: inline-flex; align-items: center; gap: 10px; color: var(--accent-ink); font-weight: 600; font-size: .95rem; margin: 0 0 18px; }
.eyebrow::before { content: ""; width: 28px; height: 2px; background: var(--accent); border-radius: 2px; }
.hero h1 { margin: 0; font-weight: 700; font-size: clamp(3.6rem, 10vw, 7.2rem); line-height: 1.12; text-wrap: balance; }
.hero h1 span { display: block; }
.hero h1 em { font-style: normal; color: var(--accent-ink); }
.lede { max-width: 30em; margin: 22px 0 0; font-size: 1.2rem; color: var(--muted); font-weight: 400; }
.hero-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 18px 24px; margin-top: 34px; }
.hero-count { margin: 0; color: var(--muted); font-size: 1rem; }
.hero-count strong { color: var(--fg); font-weight: 600; }
.perks { list-style: none; padding: 0; margin: 40px 0 0; display: flex; flex-wrap: wrap; gap: 8px 26px; color: var(--muted); font-size: .98rem; }
.perks li { display: inline-flex; align-items: center; gap: 9px; }
.perks li::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }

.portrait { position: relative; width: min(100%, 420px); aspect-ratio: 440 / 550; justify-self: center; }
.portrait .photo { position: absolute; inset: 5.4545% 4.5455% 14.5455% 4.5455%; border-radius: 999px 999px 22px 22px; overflow: hidden; background: var(--surface); }
.portrait .photo img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 28%; }
.thread { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.thread path, .thread circle { stroke: var(--accent); }
.thread .draw { animation: draw 2.4s .3s cubic-bezier(.6, .1, .2, 1) backwards; stroke-dasharray: 1; stroke-dashoffset: 0; }
.thread .knot { animation: knot .6s 2.5s ease backwards; }
@keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes knot { from { opacity: 0; } to { opacity: 1; } }

@media (max-width: 820px) {
  .hero { grid-template-columns: 1fr; }
  .portrait { order: -1; width: min(76%, 330px); }
}

/* ---------- App ---------- */
.app { max-width: 760px; margin-inline: auto; padding-block: 18px 72px; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 6px 26px; }
.back { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); text-decoration: none; font-weight: 500; padding: 8px 4px; }
.back:hover { color: var(--fg); }
.brandmark { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; }
.brandmark svg { color: var(--accent); }
.page-title { margin: 0; font-size: clamp(2rem, 6vw, 2.8rem); font-weight: 700; line-height: 1.25; }
.page-sub { margin: 4px 0 24px; color: var(--muted); }

.composer { background: var(--surface); border: 1.5px solid var(--line); border-radius: 22px; padding: 16px 16px 14px; box-shadow: 0 10px 30px -18px rgba(8, 30, 34, .35); transition: border-color .15s ease; }
.composer:focus-within { border-color: var(--brand); }
.composer textarea { display: block; width: 100%; border: 0; background: transparent; resize: none; outline: none; padding: 6px 4px 10px; min-height: 76px; max-height: 260px; font-size: 1.125rem; line-height: 1.7; }
.composer textarea::placeholder { color: var(--muted); opacity: .8; }
.c-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding-top: 12px; border-top: 1px solid var(--line); }
.c-row .spacer { flex: 1; }
.c-row .btn { min-height: 46px; }
.rec-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--danger); animation: pulse 1.2s ease-in-out infinite; flex: none; }
.rec-label { color: var(--muted); font-size: .95rem; }
#rec-time { font-weight: 600; min-width: 3ch; }
@keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.5); opacity: .5; } }

.section { margin-top: 44px; }
.sec-head { display: flex; align-items: center; gap: 12px; margin: 0 0 14px; }
.sec-head h2 { margin: 0; font-size: 1.25rem; font-weight: 600; }
.pill { min-width: 28px; height: 28px; padding-inline: 9px; display: inline-grid; place-items: center; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-weight: 700; font-size: .9rem; font-variant-numeric: tabular-nums; }
.pill.quiet { background: transparent; border: 1.5px solid var(--line); color: var(--muted); }
.fold { display: flex; align-items: center; gap: 12px; width: 100%; background: none; border: 0; padding: 0; text-align: start; }
.fold h2 { margin: 0; font-size: 1.25rem; font-weight: 600; }
.fold .chev { margin-inline-start: auto; transition: transform .2s ease; color: var(--muted); }
.fold[aria-expanded="false"] .chev { transform: rotate(-90deg); }

.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.idea { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: start; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
.idea.enter { animation: viewin .3s ease both; }
.check { width: 30px; height: 30px; margin-top: 1px; border-radius: 50%; border: 2px solid var(--brand); background: transparent; color: transparent; display: grid; place-items: center; padding: 0; transition: background .15s ease, color .15s ease, transform .15s ease; }
.check:hover { transform: scale(1.08); }
.check[aria-checked="true"] { background: var(--brand); color: var(--on-brand); }
.idea-text { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 1.0625rem; line-height: 1.75; }
.idea-meta { margin: 4px 0 0; color: var(--muted); font-size: .875rem; }
.is-done .idea-text { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1.5px; }
.is-done { background: transparent; }
.del { min-width: 40px; height: 40px; padding: 0 10px; margin: -6px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); display: inline-grid; place-items: center; font-size: .875rem; font-weight: 600; }
.del:hover { color: var(--danger); background: color-mix(in srgb, var(--danger) 10%, transparent); }
.del.armed { color: var(--danger); background: color-mix(in srgb, var(--danger) 12%, transparent); }

.voice { display: flex; align-items: center; gap: 12px; max-width: 340px; margin-top: 8px; }
.idea-text + .voice { margin-top: 12px; }
.play { flex: none; width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; padding: 0; }
.track { flex: 1; height: 8px; border-radius: 8px; background: var(--line); overflow: hidden; cursor: pointer; }
.track .fill { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 8px; }
.vtime { font-size: .875rem; color: var(--muted); min-width: 4ch; font-variant-numeric: tabular-nums; }

.empty { border: 1.5px dashed var(--line); border-radius: 16px; padding: 26px 20px; color: var(--muted); text-align: center; }
.empty strong { display: block; color: var(--fg); font-weight: 600; margin-bottom: 2px; }
.note { margin-top: 40px; color: var(--muted); font-size: .875rem; }

.toast { position: fixed; inset-inline: 16px; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); margin-inline: auto; width: fit-content; max-width: calc(100% - 32px); background: var(--fg); color: var(--bg); padding: 11px 20px; border-radius: 12px; font-weight: 500; font-size: .95rem; opacity: 0; transform: translateY(10px); pointer-events: none; transition: opacity .2s ease, transform .2s ease; z-index: 20; }
.toast.on { opacity: 1; transform: none; }

@media (max-width: 520px) {
  body { font-size: 16px; }
  .c-row .btn { flex: 1 1 auto; }
  .idea { padding: 14px; gap: 12px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>

<div class="shell" dir="rtl" lang="ar">

  <!-- Page 1: hero -->
  <section id="hero" class="hero view" aria-labelledby="hero-title">
    <div>
      <p class="eyebrow">دفتر أفكار خليل</p>
      <h1 id="hero-title"><span>خليل</span><span><em>لا تنسى</em></span></h1>
      <p class="lede">الفكرة تجي مرّة وتروح. اكتبها أو سجّلها بصوتك، وبتضل محفوظة لحد ما تخلّصها.</p>
      <div class="hero-actions">
        <a class="btn primary big" id="enter" href="#ideas">
          ادخل إلى أفكاري
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
        </a>
        <button type="button" class="btn ghost big" id="install" hidden>ثبّت التطبيق على هاتفك</button>
        <p class="hero-count" id="hero-count" hidden></p>
      </div>
      <ul class="perks">
        <li>نص أو تسجيل صوتي</li>
        <li>علّم المنجز وخلّيه محفوظ</li>
        <li>القائمة مفتوحة ومرتّبة</li>

  <!-- Page 2: ideas -->
  <main id="app" class="app view" hidden>
    <div class="topbar">
      <a class="back" id="back" href="#home">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        الرئيسية
      </a>
      <span class="brandmark">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="12" r="4.5"/><circle cx="15" cy="12" r="4.5"/><path d="M5 19c2 1.5 3 2 4 2M19 19c-2 1.5-3 2-4 2"/></svg>

      <div class="c-row" id="row-idle">
        <button type="button" class="btn ghost" id="mic">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
          سجّل بصوتك
        </button>

        <span class="rec-dot" aria-hidden="true"></span>

        <svg class="chev" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script>
(function () {
  'use strict';
  document.documentElement.lang = 'ar';
  document.documentElement.dir = 'rtl';

  var $ = function (s) { return document.querySelector(s); };
  var ICON = {
    tick: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    play: '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M8 5.2v13.6L19 12z"/></svg>',
    pause: '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><rect x="6" y="5" width="4.2" height="14" rx="1.2"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.2"/></svg>',
    trash: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>'
  };

  /* ---------- helpers ---------- */
  function h(tag, props) {
    var e = document.createElement(tag), k, v;
    props = props || {};
    for (k in props) {
      v = props[k];
      if (k === 'class') e.className = v;
      else if (k === 'html') e.innerHTML = v;
      else if (k.indexOf('on') === 0) e.addEventListener(k.slice(2), v);
      else if (v === true) e.setAttribute(k, '');
      else if (v !== false && v != null) e.setAttribute(k, v);
    }
    for (var i = 2; i < arguments.length; i++) {
      var c = arguments[i];
      if (c == null || c === false) continue;
      e.append(c.nodeType ? c : document.createTextNode(c));
    }
    return e;
  }
  function plural(n) {
    if (n === 1) return 'فكرة واحدة';
    if (n === 2) return 'فكرتان';
    if (n <= 10) return n + ' أفكار';
    return n + ' فكرة';
  }
  function two(n) { return n < 10 ? '0' + n : '' + n; }
  function fmtDur(s) { s = Math.max(0, Math.round(s || 0)); return Math.floor(s / 60) + ':' + two(s % 60); }
  function fmtTime(ms) {
    var d = new Date(ms), now = new Date(), t = two(d.getHours()) + ':' + two(d.getMinutes());
    if (d.toDateString() === now.toDateString()) return 'اليوم ' + t;
    if (d.toDateString() === new Date(now.getTime() - 864e5).toDateString()) return 'أمس ' + t;
    var day;
    try { day = new Intl.DateTimeFormat('ar-LB-u-nu-latn', { day: 'numeric', month: 'long' }).format(d); }
    catch (e) { day = d.getDate() + '/' + (d.getMonth() + 1); }
    return day + ' ' + t;
  }
  var toastTimer;
  function toast(msg) {
    var t = $('#toast');
    t.textContent = msg; t.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('on'); }, 2600);
  }
  function mintId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function toDataURL(blob) {
    return new Promise(function (res, rej) {
      var r = new FileReader();
      r.onload = function () { res(r.result); };
      r.onerror = function () { rej(r.error); };
      r.readAsDataURL(blob);
    });
  }
  function containerType(blob) {
    var t = (blob.type || '').toLowerCase();
    if (t.indexOf('webm') > -1) return 'video/webm';
    if (t.indexOf('mp4') > -1 || t.indexOf('m4a') > -1) return 'video/mp4';
    return null;
  }

  /* ---------- storage: signed-in db + assets, else this browser ---------- */
  function localStore() {
    var KEY = 'khalil_la_tansa_v1', mem = [], blobs = {}, cb = function () {};
    try { mem = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { mem = []; }
    function persist() { try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch (e) {} cb(mem.slice()); }
    function idb() {
      return new Promise(function (res, rej) {
        try {
          var r = indexedDB.open('khalil_la_tansa_audio', 1);
          r.onupgradeneeded = function () { r.result.createObjectStore('a'); };
          r.onsuccess = function () { res(r.result); };
          r.onerror = function () { rej(r.error); };
        } catch (e) { rej(e); }
      });
    }
    function idbOp(mode, fn) {
      return idb().then(function (db) {
        return new Promise(function (res, rej) {
          var tx = db.transaction('a', mode), req = fn(tx.objectStore('a'));
          tx.oncomplete = function () { res(req && req.result); };
          tx.onerror = function () { rej(tx.error); };
        });
      });
    }
    return {
      mode: 'local',
      subscribe: function (f) { cb = f; cb(mem.slice()); },
      add: function (item, blob) {
        var id = mintId(), rec = Object.assign({ id: id }, item);
        var p = Promise.resolve();
        if (blob) {
          rec.audio = { k: 'local' };
          blobs[id] = blob;
          p = idbOp('readwrite', function (s) { return s.put(blob, id); }).catch(function () {});
        }
        return p.then(function () { mem.unshift(rec); persist(); });
      },
      setDone: function (id, done) {
        mem.forEach(function (it) { if (it.id === id) { it.done = done; it.doneAt = done ? Date.now() : null; } });
        persist(); return Promise.resolve();
      },
      remove: function (it) {
        mem = mem.filter(function (x) { return x.id !== it.id; });
        delete blobs[it.id];
        if (it.audio) idbOp('readwrite', function (s) { return s.delete(it.id); }).catch(function () {});
        persist(); return Promise.resolve();
      },
      audioUrl: function (it) {
        if (blobs[it.id]) return Promise.resolve(URL.createObjectURL(blobs[it.id]));
        return idbOp('readonly', function (s) { return s.get(it.id); }).then(function (b) {
          if (!b) throw new Error('missing');
          blobs[it.id] = b; return URL.createObjectURL(b);
        });
      }
    };
  }

  function remoteStore(db, uid, assets) {
    var col = db.collection('data/users/' + uid), cb = function () {}, last = null;
    function saveAudio(blob) {
      var type = containerType(blob);
      var up = (assets && type)
        ? assets.upload(blob.type === type ? blob : new Blob([blob], { type: type }), { type: type })
            .then(function (r) { return { k: 'asset', id: r.id }; })
        : Promise.reject(new Error('no-assets'));
      return up.catch(function () {
        if (blob.size <= 170 * 1024) return toDataURL(blob).then(function (d) { return { k: 'inline', data: d }; });
        throw new Error('audio-too-big');
      });
    }
    col.onSnapshot(function (snap) {
      last = snap.docs.map(function (d) { var o = Object.assign({}, d.data()); o.id = d.id; return o; });
      cb(last);
    }, function () { toast('تعذّر تحميل أفكارك. حدّث الصفحة.'); });
    return {
      mode: 'remote',
      subscribe: function (f) { cb = f; if (last) cb(last); },
      add: function (item, blob) {
        var ref = col.doc();
        var p = blob ? saveAudio(blob) : Promise.resolve(null);
        return p.then(function (audio) {
          var data = { text: item.text || '', done: false, created: item.created, doneAt: null, dur: item.dur || 0 };
          if (audio) data.audio = audio;
          return ref.set(data);
        });
      },
      setDone: function (id, done) { return col.doc(id).update({ done: done, doneAt: done ? Date.now() : null }); },
      remove: function (it) {
        var p = col.doc(it.id).delete();
        if (it.audio && it.audio.k === 'asset' && assets) {
          p = p.then(function () { return assets.delete(it.audio.id); }).catch(function () {});
        }
        return p;
      },
      audioUrl: function (it) {
        if (it.audio.k === 'asset') return Promise.resolve('/_blob/' + it.audio.id);
        return Promise.resolve(it.audio.data);
      }
    };
  }

  /* ---------- state + render ---------- */
  var store = null, items = [], loaded = false, seen = {}, doneOpen = true;

  function render() {
    var open = items.filter(function (i) { return !i.done; }).sort(function (a, b) { return b.created - a.created; });
    var done = items.filter(function (i) { return i.done; }).sort(function (a, b) { return (b.doneAt || 0) - (a.doneAt || 0); });
    $('#cnt-open').textContent = open.length;
    $('#cnt-done').textContent = done.length;

    var lo = $('#list-open'), ld = $('#list-done');
    lo.replaceChildren(); ld.replaceChildren();
    var nextSeen = {};
    open.forEach(function (it) { lo.append(ideaEl(it, nextSeen)); });
    done.forEach(function (it) { ld.append(ideaEl(it, nextSeen)); });
    seen = nextSeen;

    if (!open.length) lo.append(h('li', { class: 'empty' }, h('strong', {}, 'ما في أفكار بانتظارك'), 'اكتب أول فكرة بالمربع فوق، أو سجّلها بصوتك.'));
    if (!done.length) ld.append(h('li', { class: 'empty' }, h('strong', {}, 'ما أنجزت شي لسا'), 'لما تعلّم فكرة بالصح، بتجي لهون وبتضل محفوظة.'));
    ld.hidden = !doneOpen;

    $('#page-sub').textContent = open.length
      ? 'عندك ' + plural(open.length) + ' بانتظارك.'
      : (done.length ? 'خلّصت كل شي. شو الفكرة الجاية؟' : 'دفترك فاضي. ابدأ بأول فكرة.');
    var hc = $('#hero-count');
    if (loaded && open.length) {
      hc.replaceChildren('عندك ', h('strong', {}, plural(open.length)), ' بانتظارك');
      hc.hidden = false;
    } else { hc.hidden = true; }
    syncPlayer();
  }

  function ideaEl(it, nextSeen) {
    var key = it.id + (it.done ? 'd' : 'a');
    nextSeen[key] = 1;
    var li = h('li', { class: 'idea' + (it.done ? ' is-done' : '') + (loaded && !seen[key] ? ' enter' : '') });
    var chk = h('button', {
      type: 'button', class: 'check', role: 'checkbox', 'aria-checked': String(!!it.done),
      'aria-label': it.done ? 'أعد الفكرة إلى القائمة' : 'علّم الفكرة كمنجزة', html: ICON.tick,
      onclick: function () { run(store.setDone(it.id, !it.done)); }
    });
    var body = h('div', { class: 'idea-body' });
    if (it.text) body.append(h('p', { class: 'idea-text' }, it.text));
    if (it.audio) body.append(voiceEl(it));
    body.append(h('p', { class: 'idea-meta' }, it.done ? 'أُنجزت ' + fmtTime(it.doneAt || it.created) : 'أُضيفت ' + fmtTime(it.created)));

    var del = h('button', { type: 'button', class: 'del', 'aria-label': 'حذف الفكرة', html: ICON.trash });
    var armed = false, tm;
    del.addEventListener('click', function () {
      if (!armed) {
        armed = true; del.classList.add('armed'); del.textContent = 'تأكيد الحذف';
        tm = setTimeout(function () { armed = false; del.classList.remove('armed'); del.innerHTML = ICON.trash; }, 3200);
        return;
      }
      clearTimeout(tm);
      if (cur === it.id) { audio.pause(); cur = null; }
      run(store.remove(it));
    });
    li.append(chk, body, del);
    return li;
  }

  function run(p) {
    Promise.resolve(p).catch(function () { toast('ما قدرت أحفظ التغيير. جرّب مرة ثانية.'); });
  }

  /* ---------- voice playback (one shared player) ---------- */
  var audio = new Audio(), cur = null;
  audio.preload = 'none';
  ['play', 'pause', 'ended', 'timeupdate', 'loadedmetadata'].forEach(function (ev) { audio.addEventListener(ev, syncPlayer); });

  function voiceEl(it) {
    var v = h('div', { class: 'voice', 'data-id': it.id });
    var b = h('button', { type: 'button', class: 'play', 'aria-label': 'تشغيل التسجيل', html: ICON.play, onclick: function () { toggleVoice(it); } });
    var fill = h('i', { class: 'fill' });
    var tr = h('div', { class: 'track' }, fill);
    tr.addEventListener('click', function (e) {
      if (cur !== it.id || !isFinite(audio.duration) || !audio.duration) return;
      var r = tr.getBoundingClientRect();
      audio.currentTime = Math.min(1, Math.max(0, (r.right - e.clientX) / r.width)) * audio.duration;
    });
    v.append(b, tr, h('span', { class: 'vtime' }, fmtDur(it.dur)));
    return v;
  }
  function toggleVoice(it) {
    if (cur === it.id && !audio.paused) { audio.pause(); return; }
    var start = function () { return audio.play().catch(function () { toast('تعذّر تشغيل التسجيل'); }); };
    if (cur === it.id) { start(); return; }
    cur = it.id;
    store.audioUrl(it).then(function (url) { audio.src = url; return start(); })
      .catch(function () { cur = null; toast('ما لقيت ملف التسجيل'); syncPlayer(); });
  }
  function syncPlayer() {
    var nodes = document.querySelectorAll('.voice');
    for (var i = 0; i < nodes.length; i++) {
      var n = nodes[i], id = n.getAttribute('data-id'), on = id === cur;
      var playing = on && !audio.paused && !audio.ended;
      var btn = n.querySelector('.play');
      var want = playing ? 'pause' : 'play';
      if (btn.getAttribute('data-s') !== want) {
        btn.innerHTML = ICON[want]; btn.setAttribute('data-s', want);
        btn.setAttribute('aria-label', playing ? 'إيقاف مؤقت' : 'تشغيل التسجيل');
      }
      var it = items.filter(function (x) { return x.id === id; })[0];
      var dur = on && isFinite(audio.duration) && audio.duration ? audio.duration : (it ? it.dur : 0);
      var pct = on && dur ? Math.min(100, (audio.currentTime / dur) * 100) : 0;
      n.querySelector('.fill').style.width = pct + '%';
      n.querySelector('.vtime').textContent = on && audio.currentTime > 0 && !audio.ended ? fmtDur(audio.currentTime) : fmtDur(dur);
    }
  }

  /* ---------- composer ---------- */
  var input = $('#idea-input'), addBtn = $('#add'), busy = false;
  function updateAdd() { addBtn.disabled = busy || !input.value.trim(); }
  function grow() { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 260) + 'px'; }
  input.addEventListener('input', function () { updateAdd(); grow(); });
  input.addEventListener('keydown', function (e) {
    var fine = window.matchMedia && matchMedia('(pointer: fine)').matches;
    if (e.key === 'Enter' && !e.isComposing && (e.ctrlKey || e.metaKey || (fine && !e.shiftKey))) {
      e.preventDefault(); $('#composer').requestSubmit();
    }
  });
  $('#composer').addEventListener('submit', function (e) {
    e.preventDefault();
    if (!input.value.trim()) { input.focus(); return; }
    addIdea({});
  });

  function addIdea(opts) {
    if (busy || !store) return Promise.resolve();
    var text = input.value.trim();
    if (!text && !opts.blob) return Promise.resolve();
    busy = true; addBtn.disabled = true;
    var item = { text: text, created: Date.now(), done: false, doneAt: null, dur: opts.dur || 0 };
    return Promise.resolve(store.add(item, opts.blob || null)).then(function () {
      input.value = ''; grow();
      toast(opts.blob ? 'تم حفظ التسجيل' : 'تم حفظ الفكرة');
    }).catch(function (err) {
      toast(err && err.message === 'audio-too-big' ? 'التسجيل كبير ولا يمكن حفظه. جرّب تسجيلاً أقصر.' : 'ما قدرت أحفظ الفكرة. جرّب مرة ثانية.');
    }).then(function () { busy = false; updateAdd(); });
  }

  /* ---------- recording ---------- */
  var rec = null;
  function setRecUI(on) {
    $('#row-idle').hidden = on; $('#row-rec').hidden = !on;
    input.disabled = on;
  }
  function pickFile() { $('#file-in').click(); }

  $('#mic').addEventListener('click', function () {
    if (rec || busy) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) { pickFile(); return; }
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
      var mime = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4'].filter(function (t) { return MediaRecorder.isTypeSupported(t); })[0];
      var mr;
      try { mr = new MediaRecorder(stream, mime ? { mimeType: mime, audioBitsPerSecond: 32000 } : { audioBitsPerSecond: 32000 }); }
      catch (e) { stream.getTracks().forEach(function (t) { t.stop(); }); pickFile(); return; }
      var r = { mr: mr, stream: stream, chunks: [], start: Date.now(), cancel: false, timer: null };
      rec = r;
      mr.ondataavailable = function (ev) { if (ev.data && ev.data.size) r.chunks.push(ev.data); };
      mr.onstop = function () {
        stream.getTracks().forEach(function (t) { t.stop(); });
        clearInterval(r.timer);
        var secs = (Date.now() - r.start) / 1000;
        rec = null; setRecUI(false);
        if (!r.cancel && r.chunks.length) addIdea({ blob: new Blob(r.chunks, { type: mr.mimeType || 'audio/webm' }), dur: secs });
      };
      mr.start();
      $('#rec-time').textContent = '0:00';
      r.timer = setInterval(function () {
        var s = (Date.now() - r.start) / 1000;
        $('#rec-time').textContent = fmtDur(s);
        if (s >= 300) mr.stop();
      }, 250);
      setRecUI(true);
    }).catch(function () { pickFile(); });
  });
  $('#rec-stop').addEventListener('click', function () { if (rec && rec.mr.state !== 'inactive') rec.mr.stop(); });
  $('#rec-cancel').addEventListener('click', function () { if (rec) { rec.cancel = true; if (rec.mr.state !== 'inactive') rec.mr.stop(); } });

  $('#file-in').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!f) return;
    var url = URL.createObjectURL(f), probe = new Audio(), done = false;
    function go(d) { if (done) return; done = true; URL.revokeObjectURL(url); addIdea({ blob: f, dur: isFinite(d) ? d : 0 }); }
    probe.preload = 'metadata';
    probe.onloadedmetadata = function () { go(probe.duration); };
    probe.onerror = function () { go(0); };
    setTimeout(function () { go(0); }, 2500);
    probe.src = url;
  });

  /* ---------- finished section fold, routing ---------- */
  $('#fold-done').addEventListener('click', function () {
    doneOpen = !doneOpen;
    this.setAttribute('aria-expanded', String(doneOpen));
    $('#list-done').hidden = !doneOpen;
  });

  function go(view) {
    var app = view === 'app';
    $('#hero').hidden = app; $('#app').hidden = !app;
    try { history.replaceState(null, '', app ? '#ideas' : '#home'); } catch (e) {}
    window.scrollTo(0, 0);
    if (app && matchMedia('(pointer: fine)').matches) setTimeout(function () { input.focus(); }, 380);
  }
  $('#enter').addEventListener('click', function (e) { e.preventDefault(); go('app'); });
  $('#back').addEventListener('click', function (e) { e.preventDefault(); go('hero'); });
  window.addEventListener('hashchange', function () { go(location.hash === '#ideas' ? 'app' : 'hero'); });
  if (location.hash === '#ideas') { $('#hero').hidden = true; $('#app').hidden = false; }

  /* ---------- boot ---------- */
  function boot(s) {
    store = s;
    $('#store-note').textContent = s.mode === 'remote'
      ? 'أفكارك محفوظة في حسابك وتظهر على أي جهاز تفتح منه هذه الصفحة.'
      : 'أفكارك وتسجيلاتك محفوظة على هذا الجهاز فقط، ولا تُرفع لأي مكان.';
    s.subscribe(function (list) { items = list; loaded = true; render(); });
  }
  render();
  var use = window.claude && window.claude.use ? window.claude.use.bind(window.claude) : null;
  if (!use) { boot(localStore()); return; }
  Promise.all([use('db'), use('user')]).then(function (r) {
    if (!r[0] || !r[1]) return null;
    return Promise.resolve(r[1].id()).then(function (uid) {
      if (!uid) return null;
      return use('assets').catch(function () { return null; }).then(function (assets) { return remoteStore(r[0], uid, assets); });
    });
  }).catch(function () { return null; }).then(function (s) { boot(s || localStore()); });
})();
</script>

<script>
(function(){
  var ib=document.getElementById('install'), dp=null;
  window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();dp=e;ib.hidden=false;});
  ib.addEventListener('click',function(){ if(!dp)return; dp.prompt(); dp.userChoice.finally(function(){dp=null;ib.hidden=true;}); });
  window.addEventListener('appinstalled',function(){ib.hidden=true;});
  try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  if('serviceWorker' in navigator){ window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
})();
</script>
